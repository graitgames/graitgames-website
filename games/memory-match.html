<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match — GRaiT GAMES</title>
  <meta name="description" content="Memory Match — a synthwave card-flipping memory game. Find all the pairs in the fewest moves. A GRaiT GAMES original." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Master design system (one level up from /games/) -->
  <link rel="stylesheet" href="../styles.css" />

  <!-- ===================================================================
       GAME-SPECIFIC STYLES
       Reuses the global brand variables (--color-orange, --font-logo …)
       defined in styles.css. Only the board/card layout lives here.
       =================================================================== -->
  <style>
    .game-stage {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }

    /* Stat read-outs (time / moves / matches) */
    .game-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }
    .stat-box {
      flex: 1 1 0;
      min-width: 110px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-accessible);
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
      text-align: center;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: var(--space-xs);
    }
    .stat-value {
      font-family: var(--font-headline);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-green);
    }

    /* 4 × 4 board */
    .memory-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      perspective: 1000px;
    }

    /* Each card is a button for full keyboard support */
    .mem-card {
      position: relative;
      aspect-ratio: 1 / 1;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform var(--transition-normal);
    }
    .mem-card.flipped,
    .mem-card.matched {
      transform: rotateY(180deg);
    }
    .mem-card:disabled { cursor: default; }

    /* Shared face styling */
    .mem-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--border-radius-lg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: clamp(1.5rem, 7vw, 2.4rem);
      user-select: none;
    }

    /* Card back (face-down) — orange grid tile */
    .mem-back {
      background:
        linear-gradient(135deg, var(--bg-panel) 0%, var(--bg-secondary) 100%);
      border: 2px solid var(--color-orange);
      color: var(--color-orange);
      font-family: var(--font-logo);
      font-size: clamp(0.7rem, 3vw, 1rem);
    }

    /* Card front (the symbol) — green frame */
    .mem-front {
      background-color: var(--bg-secondary);
      border: 2px solid var(--color-green);
      transform: rotateY(180deg);
    }

    .mem-card.matched .mem-front {
      box-shadow: var(--glow-green);
      animation: matchPop 0.4s ease;
    }
    @keyframes matchPop {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* Win banner */
    .win-banner {
      text-align: center;
      background-color: var(--bg-secondary);
      border: 2px solid var(--color-green);
      border-radius: var(--border-radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-xl);
    }
    .win-banner h2 { color: var(--color-green); margin-bottom: var(--space-sm); }

    .game-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: center;
      margin-top: var(--space-xl);
    }

    @media (prefers-reduced-motion: reduce) {
      .mem-card { transition: none; }
      .mem-card.matched .mem-front { animation: none; }
    }

    /* ── Initials entry (inside win banner) ───────────────────────── */
    #win-initials { display: none; margin-top: 12px; }
    #win-initials p { margin-bottom: 8px; }
    .initials-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 12px 0 16px;
    }
    .initial-box {
      width: 52px;
      height: 60px;
      background: var(--bg-secondary);
      border: 2px solid var(--color-green);
      border-radius: var(--border-radius);
      color: var(--color-green);
      font-family: var(--font-logo);
      font-size: 1.3rem;
      text-align: center;
      text-transform: uppercase;
      caret-color: transparent;
      outline: none;
      box-shadow: var(--glow-green);
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .initial-box:focus { border-color: var(--color-cyan); color: var(--color-cyan); box-shadow: var(--glow-cyan); }
    .initials-actions { display: flex; gap: 12px; justify-content: center; }

    /* ── Leaderboard panel (right of game-stage on desktop) ───────── */
    .leaderboard {
      position: absolute;
      left: calc(100% + 14px);
      top: 0;
      width: 250px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-accessible);
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
    }
    @media (max-width: 1000px) {
      .leaderboard { position: static; width: 250px; margin: var(--space-lg) 0 0 auto; }
    }
    .lb-heading {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-green);
      text-align: center;
      margin-bottom: var(--space-md);
    }
    .lb-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.85rem; }
    .lb-table th {
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-accessible);
      text-align: left;
    }
    .lb-table th:last-child, .lb-table td:last-child { text-align: right; }
    .lb-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .lb-rank  { color: var(--text-muted); width: 2.2rem; }
    .lb-name  { color: var(--color-cyan); font-weight: 600; letter-spacing: 0.18em; }
    .lb-score { color: var(--color-green); }
    .lb-empty { text-align: center; color: var(--text-muted); padding: 20px 8px; }
    tr.lb-new .lb-name, tr.lb-new .lb-score { color: var(--color-orange); }
  </style>
</head>
<body>

  <a href="#game" class="skip-link">Skip to game</a>

  <!-- Navigation injected by nav.js -->
  <nav id="main-nav"></nav>

  <main class="container-narrow section" id="game">

    <!-- Header bar: back | title | restart -->
    <div class="game-header">
      <a href="/games.html" class="btn btn-outline-cyan btn-icon" aria-label="Back to Catalog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
      <p class="game-title-bar" role="heading" aria-level="1">MEMORY MATCH</p>
      <button type="button" class="btn-restart" id="restart" aria-label="Start a new game"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>

    <header class="text-center mb-xl">
      <p class="text-description">
        Flip the tiles and find all <span class="text-orange">8 pairs</span>.
        Fewer moves &amp; less time = a better score!
      </p>
    </header>

    <div class="game-stage">

      <!-- Live stats -->
      <div class="game-stats" role="status" aria-live="polite">
        <div class="stat-box">
          <div class="stat-label">Time</div>
          <div class="stat-value" id="time">0:00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Moves</div>
          <div class="stat-value" id="moves">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Points</div>
          <div class="stat-value" id="points">0</div>
        </div>
      </div>

      <!-- Win banner (hidden until the player wins) -->
      <div class="win-banner hidden" id="win-banner" role="alert">
        <h2>🏆 You Win!</h2>

        <!-- Initials entry: shown when score qualifies for top 10 -->
        <div id="win-initials">
          <p id="win-score-label"></p>
          <p>Enter your initials:</p>
          <div class="initials-row">
            <input class="initial-box" id="i0" type="text" maxlength="1"
                   inputmode="text" autocomplete="off" spellcheck="false" aria-label="First initial" />
            <input class="initial-box" id="i1" type="text" maxlength="1"
                   inputmode="text" autocomplete="off" spellcheck="false" aria-label="Second initial" />
            <input class="initial-box" id="i2" type="text" maxlength="1"
                   inputmode="text" autocomplete="off" spellcheck="false" aria-label="Third initial" />
          </div>
          <div class="initials-actions">
            <button type="button" class="btn btn-primary"      id="submit-initials">Submit</button>
            <button type="button" class="btn btn-outline-cyan" id="skip-initials">Skip</button>
          </div>
        </div>

        <!-- Standard summary: shown after submission or when not qualifying -->
        <div id="win-standard">
          <p class="mb-0" id="win-summary">Nice memory!</p>
        </div>
      </div>

      <!-- Leaderboard panel -->
      <section class="leaderboard" aria-labelledby="lb-heading">
        <p class="lb-heading" id="lb-heading">// Monthly Leaderboard //</p>
        <table class="lb-table" aria-label="Monthly leaderboard">
          <thead>
            <tr><th scope="col">#</th><th scope="col">Name</th><th scope="col">Score</th></tr>
          </thead>
          <tbody id="lb-body">
            <tr><td colspan="3" class="lb-empty">Loading…</td></tr>
          </tbody>
        </table>
      </section>

      <!-- The board (cards injected by JS) -->
      <div class="memory-board" id="board" aria-label="Memory match board"></div>

    </div>
  </main>

  <!-- ===================================================================
       GAME LOGIC
       =================================================================== -->
  <script>
  (function () {
    'use strict';

    /* The 8 symbols — each appears twice to make 8 pairs (16 cards). */
    var SYMBOLS = ['👾', '🚀', '🕹️', '⭐', '💾', '🎮', '👻', '🔋'];

    var GAME_KEY     = 'memory-match';
    var cachedScores = [];

    /* DOM refs */
    var board          = document.getElementById('board');
    var timeEl         = document.getElementById('time');
    var movesEl        = document.getElementById('moves');
    var pointsEl       = document.getElementById('points');
    var winBanner      = document.getElementById('win-banner');
    var winInitials    = document.getElementById('win-initials');
    var winStandard    = document.getElementById('win-standard');
    var winSummary     = document.getElementById('win-summary');
    var winScoreLabel  = document.getElementById('win-score-label');
    var submitInitBtn  = document.getElementById('submit-initials');
    var skipInitBtn    = document.getElementById('skip-initials');
    var initBoxes      = [document.getElementById('i0'), document.getElementById('i1'), document.getElementById('i2')];
    var lbBody         = document.getElementById('lb-body');
    var restartBtn     = document.getElementById('restart');

    /* Game state */
    var firstCard, secondCard, lockBoard;
    var moves, matchedPairs, points, seconds, timerId, started;

    /* Time bonus based on total elapsed seconds when the match is made */
    function getTimeBonus(s) {
      if (s <= 5)  return 10;
      if (s < 10)  return 8;
      if (s < 15)  return 6;
      if (s < 20)  return 4;
      return 2;
    }

    /* Fisher–Yates shuffle */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = s % 60;
      return m + ':' + (sec < 10 ? '0' + sec : sec);
    }

    function startTimer() {
      if (started) return;          // only start on first flip
      started = true;
      timerId = setInterval(function () {
        seconds++;
        timeEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
    }

    /* Build a fresh board */
    function init() {
      stopTimer();
      board.innerHTML = '';
      firstCard = secondCard = null;
      lockBoard = false;
      moves = matchedPairs = points = seconds = 0;
      started = false;
      movesEl.textContent = '0';
      pointsEl.textContent = '0';
      timeEl.textContent = '0:00';
      winBanner.classList.add('hidden');

      /* Duplicate, shuffle, render */
      var deck = shuffle(SYMBOLS.concat(SYMBOLS).slice());

      deck.forEach(function (symbol, index) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'mem-card';
        card.setAttribute('data-symbol', symbol);
        card.setAttribute('aria-label', 'Hidden card ' + (index + 1));
        card.innerHTML =
          '<span class="mem-face mem-back" aria-hidden="true">GR</span>' +
          '<span class="mem-face mem-front" aria-hidden="true">' + symbol + '</span>';
        card.addEventListener('click', function () { flip(card); });
        board.appendChild(card);
      });
    }

    function flip(card) {
      if (lockBoard) return;
      if (card === firstCard) return;        // ignore double-click same card
      if (card.classList.contains('matched')) return;

      startTimer();
      card.classList.add('flipped');
      card.setAttribute('aria-label', 'Card showing ' + card.dataset.symbol);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }

    function checkMatch() {
      var isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;
      if (isMatch) {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        firstCard.disabled = true;
        secondCard.disabled = true;
        resetTurn();
        matchedPairs++;
        var matchPoints = Math.max(0, (100 - moves) * getTimeBonus(seconds));
        points += matchPoints;
        pointsEl.textContent = points;
        if (matchedPairs === SYMBOLS.length) win();
      } else {
        lockBoard = true;
        setTimeout(function () {
          firstCard.classList.remove('flipped');
          secondCard.classList.remove('flipped');
          resetTurn();
        }, 850);
      }
    }

    function resetTurn() {
      firstCard = secondCard = null;
      lockBoard = false;
    }

    /* ── Leaderboard ──────────────────────────────────────────────── */
    function fetchLeaderboard() {
      fetch('/api/scores?game=' + GAME_KEY)
        .then(function (r) { return r.json().then(function (d) { return r.ok ? d : null; }); })
        .then(function (data) { renderLeaderboard(data && data.scores ? data.scores : [], null); })
        .catch(function () { renderLeaderboard([], null); });
    }

    function renderLeaderboard(scores, newInitials) {
      if (!scores || scores.length === 0) {
        lbBody.innerHTML = '<tr><td colspan="3" class="lb-empty">No scores yet this month. Be first!</td></tr>';
        return;
      }
      lbBody.innerHTML = scores.map(function (row, i) {
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1) + '.';
        var isNew = newInitials && i === scores.findIndex(function (s) { return s.initials === newInitials; });
        return '<tr' + (isNew ? ' class="lb-new"' : '') + '>' +
          '<td class="lb-rank">'  + medal + '</td>' +
          '<td class="lb-name">'  + row.initials + '</td>' +
          '<td class="lb-score">' + row.score + '</td>' +
          '</tr>';
      }).join('');
    }

    function qualifiesForLeaderboard(s) {
      if (s <= 0) return false;
      if (cachedScores.length < 10) return true;
      return s > cachedScores[cachedScores.length - 1].score;
    }

    /* Initials box keyboard handling */
    initBoxes.forEach(function (box, idx) {
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace')   { e.preventDefault(); box.value = ''; if (idx > 0) initBoxes[idx - 1].focus(); return; }
        if (e.key === 'Enter')       { e.preventDefault(); submitInitBtn.click(); return; }
        if (e.key === 'ArrowLeft'  && idx > 0) { e.preventDefault(); initBoxes[idx - 1].focus(); return; }
        if (e.key === 'ArrowRight' && idx < 2) { e.preventDefault(); initBoxes[idx + 1].focus(); return; }
      });
      box.addEventListener('input', function () {
        var val = box.value.replace(/[^A-Za-z]/g, '').slice(-1).toUpperCase();
        box.value = val;
        if (val && idx < 2) initBoxes[idx + 1].focus();
      });
    });

    submitInitBtn.addEventListener('click', function () {
      var initials = initBoxes.map(function (b) { return b.value.toUpperCase(); }).join('');
      if (!/^[A-Z]{3}$/.test(initials)) return;
      submitInitBtn.disabled = true; skipInitBtn.disabled = true;
      submitInitBtn.textContent = 'Saving…';
      fetch('/api/submit-score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: GAME_KEY, initials: initials, score: points })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.accepted && data.scores) { cachedScores = data.scores; renderLeaderboard(cachedScores, initials); }
          showWinStandard();
        })
        .catch(function () { showWinStandard(); })
        .finally(function () { submitInitBtn.disabled = false; skipInitBtn.disabled = false; submitInitBtn.textContent = 'Submit'; });
    });

    skipInitBtn.addEventListener('click', showWinStandard);

    function showWinStandard() {
      winInitials.style.display = 'none';
      winStandard.style.display = '';
      winSummary.textContent = 'Solved in ' + moves + ' moves and ' + formatTime(seconds) + '. Can you do better?';
    }
    /* ── end leaderboard ── */

    function win() {
      stopTimer();
      winBanner.classList.remove('hidden');
      if (qualifiesForLeaderboard(points)) {
        winScoreLabel.textContent = 'You scored ' + points + ' points!';
        winInitials.style.display = 'block';
        winStandard.style.display = 'none';
        initBoxes.forEach(function (b) { b.value = ''; });
        initBoxes[0].focus();
      } else {
        showWinStandard();
      }
    }

    restartBtn.addEventListener('click', init);

    /* Boot */
    init();
    fetchLeaderboard();
  })();
  </script>

  <!-- Footer injected by footer.js (uses absolute paths so it works here) -->
  <script src="../nav.js"></script>
  <script src="../footer.js"></script>
</body>
</html>
