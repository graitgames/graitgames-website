<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>4ordle — GRaiT GAMES</title>
  <meta name="description" content="4ordle — Solve four Wordles at once! A GRaiT GAMES original." />

  <!-- Font preconnects: speeds up Google Fonts loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- GRaiT GAMES brand fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- Master design system (one level up from /games/) -->
  <link rel="stylesheet" href="../styles.css" />

  <style>
    /* ============================================
       CSS CUSTOM PROPERTIES (DESIGN TOKENS)
       These match the GRaiT GAMES brand exactly.
       Using variables means one change here updates
       the whole game's look instantly.
       ============================================ */
    :root {
      --color-orange:       #FF6B2B;
      --color-green:        #39FF14;
      --color-cyan:         #00EAFF;
      --color-cyan-2:       #00C8DC;
      --bg-primary:         #07070F;
      --bg-secondary:       #0D0D1A;
      --bg-panel:           #131323;
      --border-accessible:  rgba(255, 255, 255, 0.15);
      --text-primary:       #FFFFFF;
      --text-muted:         rgba(255, 255, 255, 0.6);
      --text-description:   rgba(255, 255, 255, 0.75);

      /* Tile state colors */
      --tile-correct:  #39FF14; /* Neon green  = correct position */
      --tile-present:  #FF6B2B; /* Orange      = wrong position   */
      --tile-absent:   #1a1a2e; /* Deep space  = not in word      */

      /* Neon glow effects (on borders/boxes only — NOT on text) */
      --glow-green:  0 0 12px rgba(57, 255, 20, 0.45);
      --glow-orange: 0 0 12px rgba(255, 107, 43, 0.45);
      --glow-cyan:   0 0 12px rgba(0, 234, 255, 0.35);
    }

    /* ============================================
       GAME FONT OVERRIDE
       Use Arial throughout the game and force all
       text uppercase. Scoped to #game so the injected
       site nav/footer keep their own brand fonts.
       ============================================ */
    #game,
    #game * {
      font-family: Arial, Helvetica, sans-serif !important;
      text-transform: uppercase !important;
    }

    #game {
      padding-top: 32px;
      padding-bottom: 40px;
      /* Disable the browser's double-tap-to-zoom gesture (which fires when a
         player taps the same on-screen key twice quickly) while still allowing
         normal page scrolling. */
      touch-action: manipulation;
    }

    .skip-link {
      position: absolute;
      top: -999px;
      left: 0;
      background: var(--color-cyan);
      color: var(--bg-primary);
      padding: 8px 16px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      z-index: 9999;
      border-radius: 0 0 8px 0;
    }
    .skip-link:focus { top: 0; }

    /* Status bar — sits below the title row */
    .game-status-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    /* Status text (e.g. "2 / 4 solved · Guess 4 / 9") */
    #status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Override the game-wide Arial rule so the title keeps Press Start 2P */
    #game .game-title-bar {
      font-family: 'Press Start 2P', monospace !important;
      text-transform: none !important;
    }

    /* Focus ring override for keyboard nav (WCAG requirement) */
    .btn-restart:focus-visible {
      outline: 2px solid var(--color-cyan);
      outline-offset: 3px;
    }

    /* ============================================
       GAME BOARDS GRID
       2-column layout on desktop, stacks on mobile
       ============================================ */
    #boards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 900px;
    }

    /* Individual board panel */
    .board {
      background: var(--bg-secondary);
      border: 1px solid var(--border-accessible);
      border-radius: 8px;
      padding: 6px 10%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    /* Green glow border when a board is solved */
    .board.solved {
      border-color: var(--color-green);
      box-shadow: var(--glow-green);
    }

    /* Orange glow border when game ends unsolved */
    .board.failed {
      border-color: var(--color-orange);
      box-shadow: var(--glow-orange);
      opacity: 0.75;
    }

    /* ============================================
       TILE GRID
       9 rows × 5 columns
       ============================================ */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
    }

    /* Empty future rows — thin placeholder line */
    .row.row-empty {
      height: 18px;
      overflow: hidden;
    }
    .row.row-empty .tile {
      height: 18px;
      border-width: 1px;
      border-radius: 2px;
      font-size: 0;
    }

    /* Active row — input row */
    .row.row-active .tile {
      height: 24px;
      font-size: 14px;
    }

    /* Solved row — all-green winning guess */
    .row.row-solved .tile {
      height: 24px;
      font-size: 0.8rem;
    }

    /* Base tile — played rows are 18px with small text */
    .tile {
      width: 100%;
      height: 18px;
      border: 2px solid var(--border-accessible);
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      text-transform: uppercase;
      color: var(--text-primary);
      border-radius: 4px;
      transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease;
    }

    /* Tile has a letter typed but not yet submitted */
    .tile.filled {
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.06);
    }

    /* ✅ Correct position — neon green */
    .tile.correct {
      background: var(--tile-correct);
      border-color: var(--tile-correct);
      color: var(--bg-primary); /* Dark text on bright bg for contrast */
    }

    /* 🟡 Right letter, wrong position — orange */
    .tile.present {
      background: var(--tile-present);
      border-color: var(--tile-present);
      color: var(--bg-primary);
    }

    /* ❌ Letter not in word — dark/absent */
    .tile.absent {
      background: var(--tile-absent);
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    /* ============================================
       MESSAGE & DICTIONARY STATUS
       ============================================ */
    #message {
      height: 24px;
      margin-top: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      color: var(--color-cyan);
      text-align: center;
      /* aria-live="polite" on the element announces to screen readers */
    }

    #dict-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
      max-width: 600px;
    }

    /* ============================================
       ON-SCREEN KEYBOARD
       ============================================ */
    #keyboard {
      margin: 4px auto 0;    /* auto left/right margins centre the keyboard */
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;   /* centre the rows within the keyboard block */
      gap: 6px;
    }

    .krow {
      display: flex;
      justify-content: center;
      width: 100%;
      gap: 5px;
    }

    .key {
      /* Base key style — neutral grey. position:relative + overflow:hidden so
         the four coloured quadrant layers can be absolutely positioned inside. */
      position: relative;
      overflow: hidden;
      background: var(--bg-panel);
      border: 1px solid var(--border-accessible);
      color: var(--text-primary);
      padding: 6px 6px;
      min-width: 28px;
      border-radius: 5px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.48rem;
      text-transform: uppercase;
      cursor: pointer;
      flex: 1;
      max-width: 42px;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      /* Prevent double-tap zoom on the keys themselves */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .key.wide {
      flex: 1.7;
      max-width: 68px;
      font-size: 1.27rem;
      letter-spacing: 0;
    }
    .key[data-key="ENTER"] { font-size: 10.6px; }

    /* ---- Quadrant coloring (one per board, like Quordle) ----
       Each letter key holds four .quad layers, arranged 2×2:
         q0 = board 1 (top-left)     q1 = board 2 (top-right)
         q2 = board 3 (bottom-left)  q3 = board 4 (bottom-right)
       Each quadrant is tinted green/orange/dark per that board's status. */
    .quad {
      position: absolute;
      width: 50%;
      height: 50%;
      background: transparent;   /* unknown letters: show the neutral key bg */
      pointer-events: none;
    }
    .quad.q0 { top: 0;    left: 0; }
    .quad.q1 { top: 0;    right: 0; }
    .quad.q2 { bottom: 0; left: 0; }
    .quad.q3 { bottom: 0; right: 0; }

    .quad.correct { background: var(--tile-correct); }
    .quad.present { background: var(--tile-present); }
    .quad.absent  { background: var(--tile-absent); }

    /* The letter label sits above the quadrant layers. A subtle dark drop
       shadow (not a glow) keeps it legible over any quadrant colour. */
    .klabel {
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
    }

    /* Used letters: dim the label from white to grey. The dark text-shadow
       above keeps it legible where it overlaps a coloured quadrant. */
    .klabel.used {
      color: var(--text-muted);
    }

    /* "Dead" key: a used letter that's in none of the four words. Fill the key
       with a clearly distinct mid-grey (darker than the grey label so contrast
       holds) and flatten the quadrants, so eliminated letters read as one solid
       grey block — an unmistakable double cue alongside the grey label. */
    .key.dead {
      background: #3a3a45;
      border-color: rgba(255, 255, 255, 0.08);
    }
    .key.dead .quad { background: transparent; }

    .key:hover:not(:disabled) { filter: brightness(1.2); }

    .key:focus-visible {
      outline: 2px solid var(--color-cyan);
      outline-offset: 2px;
    }

    /* ============================================
       RESPONSIVE DESIGN
       Mobile-first: shrink tiles on small screens
       ============================================ */
    @media (max-width: 600px) {
      .tile { height: 18px; font-size: 0.65rem; }
      .row.row-active .tile { height: 24px; font-size: 0.8rem; }
      .row.row-solved .tile { height: 24px; font-size: 0.8rem; }
      .row.row-empty { height: 18px; }
      .row.row-empty .tile { height: 18px; }
      .game-title { font-size: 0.9rem; }
      .key   { padding: 6px 4px; font-size: 1.27rem; }
      .key[data-key="ENTER"] { font-size: 10.6px; }
      #boards { gap: 4px; }
    }

    @media (max-width: 380px) {
      .tile { height: 18px; font-size: 0.6rem; }
      .row.row-active .tile { height: 24px; font-size: 0.75rem; }
      .row.row-solved .tile { height: 24px; font-size: 0.75rem; }
      .key  { padding: 8px 2px; }
    }

    /* ============================================
       REDUCED MOTION
       Respects user's OS-level "reduce motion" pref.
       Disables all animations for users who need it.
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Skip link: hidden visually, revealed on keyboard focus.

      <!-- Restart button (disabled until dictionary is loaded) -->

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>

    <div class="game-status-bar">

    </div>

    <!-- ============================================
         FOUR GAME BOARDS
         Rendered dynamically by renderBoards()
         aria-label on the container describes purpose
         ============================================ -->
    <div id="boards" role="group" aria-label="Four Wordle boards"></div>

    <!-- Message area: flashes feedback like "Not in word list"
         aria-live="assertive" interrupts screen readers immediately
         (used here because the message is time-sensitive feedback) -->
    <div id="message" role="status" aria-live="assertive" aria-atomic="true"></div>

    <!-- Dictionary load status (non-critical info) -->
    <div id="dict-status" aria-live="polite"></div>

    <!-- ============================================
         ON-SCREEN KEYBOARD
         Rendered dynamically by renderKeyboard()
         ============================================ -->
    <div id="keyboard" role="group" aria-label="Letter keyboard"></div>

  </main>

       ============================================ */
    var DICT_URL       = "https://raw.githubusercontent.com/tabatkins/wordle-list/main/words";
    var DICT_CACHE_KEY = "graitFordle_dict_v1"; /* versioned key — bump to force re-fetch */
    var VALID_GUESSES  = null; /* Will be a Set<string> once loaded */

    async function loadDictionary() {
      /* --- Try localStorage cache first (instant load) --- */
      try {
        var cached = localStorage.getItem(DICT_CACHE_KEY);
        if (cached) {
          var arr = JSON.parse(cached);
          if (Array.isArray(arr) && arr.length > 5000) {
            VALID_GUESSES = new Set(arr);
            setDictStatus(''); /* loaded silently — no debug text on screen */
            return;
          }
        }
      } catch (cacheError) { /* Cache corrupt — continue to network fetch */ }

      /* --- Fetch from GitHub (one-time, ~100 KB) --- */
      try {
        setDictStatus('Fetching Wordle dictionary from GitHub (~100 KB, one-time)…');
        var res = await fetch(DICT_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var text = await res.text();

        /* Filter to only clean 5-letter lowercase words */
        var words = text.split(/\s+/).filter(function (w) {
          return /^[a-z]{5}$/.test(w);
        });

        if (words.length < 5000) throw new Error('List suspiciously short');

        VALID_GUESSES = new Set(words);

        /* Cache for next visit */
        try { localStorage.setItem(DICT_CACHE_KEY, JSON.stringify(words)); } catch (e) {}

        setDictStatus(''); /* loaded silently — no debug text on screen */

      } catch (networkError) {
        /* Graceful fallback: use answer pool only */
        VALID_GUESSES = new Set(ANSWERS);
        setDictStatus('⚠ Could not load full dictionary — using built-in word list. Some valid words may be rejected.');
      }
    }

    function setDictStatus(message) {
      document.getElementById('dict-status').textContent = message;
    }

    /* ============================================
       CONSTANTS & CONFIGURATION
       Centralised here so they're easy to find
       and change if we ever want to adjust the game.
       ============================================ */
    var NUM_BOARDS  = 4;  /* Number of simultaneous boards */
    var MAX_GUESSES = 9;  /* Maximum guesses allowed */
    var WORD_LEN    = 5;  /* Letters per word */

    /* ============================================
       GAME STATE
       All mutable game data lives here.
       Reset by newGame() at the start of each round.
       ============================================ */
    var targets      = []; /* The 4 hidden answer words */
    var solved       = []; /* Boolean per board: has it been solved? */
    var guesses      = []; /* Array of submitted guess strings (shared across boards) */
    var currentGuess = ''; /* Letters typed so far (not yet submitted) */
    var keyState     = {}; /* letter -> best status seen across all boards */
    var gameOver     = false;

    /* ============================================
       TARGET SELECTION
       Fisher-Yates partial shuffle: picks 4 unique
       random words from the answer pool.

       Why unique? So two boards never share the
       same answer — that would be confusing and unfair.
       ============================================ */
    function pickTargets() {
      var pool = ANSWERS.slice(); /* Copy so we don't modify the original */
      var selected = [];
      for (var i = 0; i < NUM_BOARDS; i++) {
        var randomIndex = Math.floor(Math.random() * pool.length);
        selected.push(pool.splice(randomIndex, 1)[0]);
        /* splice() removes the chosen word so it can't be picked again */
      }
      return selected;
    }

    /* ============================================
       NEW GAME
       Resets all state and renders fresh boards.
       ============================================ */
    function newGame() {
      if (!VALID_GUESSES) return; /* Safety: don't start before dictionary loads */
      targets      = pickTargets();
      solved       = [false, false, false, false];
      guesses      = [];
      currentGuess = '';
      keyState     = {};
      gameOver     = false;
      document.getElementById('message').textContent = '';
      renderBoards();
      renderKeyboard();
      updateStatus();
    }

    /* ============================================
       SCORING ALGORITHM
       Given a guess and a target word, returns an
       array of 5 status strings: "correct", "present",
       or "absent" for each letter position.

       Two-pass approach (same as official Wordle):
       Pass 1: Mark exact matches (correct).
       Pass 2: Mark letters in wrong position (present).

       We track letter counts to handle duplicate
       letters correctly — e.g. guessing "speed"
       against "debug" should only mark one 'e'.
       ============================================ */
    function scoreGuess(guess, target) {
      var result     = ['absent', 'absent', 'absent', 'absent', 'absent'];
      var targetArr  = target.split('');
      var guessArr   = guess.split('');
      var letterCounts = {}; /* How many of each letter remain unmatched in target */

      /* Pass 1: Find correct (green) letters */
      for (var i = 0; i < WORD_LEN; i++) {
        if (guessArr[i] === targetArr[i]) {
          result[i] = 'correct';
        } else {
          /* Count unmatched target letters for pass 2 */
          letterCounts[targetArr[i]] = (letterCounts[targetArr[i]] || 0) + 1;
        }
      }

      /* Pass 2: Find present (orange) letters */
      for (var j = 0; j < WORD_LEN; j++) {
        if (result[j] === 'correct') continue; /* Already matched */
        var letter = guessArr[j];
        if (letterCounts[letter] > 0) {
          result[j] = 'present';
          letterCounts[letter]--; /* Consume one count so duplicates aren't over-marked */
        }
      }

      return result;
    }

    /* ============================================
       KEYBOARD STATE TRACKING
       We show the best status a letter has achieved
       across ALL boards on the keyboard.

       Priority: correct > present > absent
       (A letter that's correct in board 1 should
       show green even if it's absent in board 2)
       ============================================ */
    var STATUS_RANK = { absent: 1, present: 2, correct: 3 };

    /* keyState[letter] is an array of 4 statuses — one per board — so the
       on-screen key can show each board's progress in its own quadrant.
       For a given board we keep the BEST status seen (correct > present >
       absent), exactly like the official Quordle keyboard. */
    function bumpKeyState(letter, boardIndex, newStatus) {
      if (!keyState[letter]) keyState[letter] = [null, null, null, null];
      var currentStatus = keyState[letter][boardIndex];
      if (!currentStatus || STATUS_RANK[newStatus] > STATUS_RANK[currentStatus]) {
        keyState[letter][boardIndex] = newStatus;
      }
    }

    /* ============================================
       RENDER: BOARDS
       Rebuilds all four boards from current state.
       Called after every guess and keypress.
       ============================================ */
    function renderBoards() {
      var container = document.getElementById('boards');
      container.innerHTML = '';

      for (var b = 0; b < NUM_BOARDS; b++) {
        var boardEl = document.createElement('div');
        boardEl.className = 'board';
        boardEl.setAttribute('aria-label', 'Board ' + (b + 1) + (solved[b] ? ', solved' : ''));

        if (solved[b])  boardEl.classList.add('solved');
        else if (gameOver) boardEl.classList.add('failed');

        var gridEl = document.createElement('div');
        gridEl.className = 'grid';
        gridEl.setAttribute('role', 'grid');
        gridEl.setAttribute('aria-label', 'Board ' + (b + 1) + ' guesses');

        for (var r = 0; r < MAX_GUESSES; r++) {
          var rowEl  = document.createElement('div');
          rowEl.className = 'row';
          rowEl.setAttribute('role', 'row');

          var isActive = (r === guesses.length && !solved[b] && !gameOver);
          var isPlayed = (r < guesses.length);
          if (!isActive && !isPlayed) rowEl.classList.add('row-empty');
          if (isActive) rowEl.classList.add('row-active');

          var rowText   = '';
          var rowStatus = null;

          if (r < guesses.length) {
            /* This row has a submitted guess */
            rowText = guesses[r];

            if (solved[b]) {
              /* Once a board is solved, stop showing rows after the winning guess */
              var winGuessIndex = guesses.indexOf(targets[b]);
              if (r > winGuessIndex) {
                rowText = ''; /* Blank rows after the solve */
              } else {
                rowStatus = scoreGuess(rowText, targets[b]);
                if (rowStatus && rowStatus.every(function(s) { return s === 'correct'; })) {
                  rowEl.classList.add('row-solved');
                }
              }
            } else {
              rowStatus = scoreGuess(rowText, targets[b]);
            }

          } else if (r === guesses.length && !solved[b] && !gameOver) {
            /* This is the active row — show letters being typed */
            rowText = currentGuess.padEnd(WORD_LEN, ' ');
          }

          /* Render each tile in the row */
          for (var c = 0; c < WORD_LEN; c++) {
            var tileEl = document.createElement('div');
            tileEl.className = 'tile';
            tileEl.setAttribute('role', 'gridcell');

            var ch = (rowText[c] && rowText[c] !== ' ') ? rowText[c] : '';
            tileEl.textContent = ch;

            if (rowStatus) {
              tileEl.classList.add(rowStatus[c]);
              tileEl.setAttribute('aria-label', ch + ' ' + rowStatus[c]);
            } else if (ch) {
              tileEl.classList.add('filled');
              tileEl.setAttribute('aria-label', ch);
            } else {
              tileEl.setAttribute('aria-label', 'empty');
            }

            rowEl.appendChild(tileEl);
          }

          gridEl.appendChild(rowEl);
        }

        boardEl.appendChild(gridEl);
        container.appendChild(boardEl);
      }
    }

    /* ============================================
       RENDER: KEYBOARD
       Three rows of keys. Each key shows the best
       status it has achieved across all boards.
       ============================================ */
    var KEY_ROWS = [
      'qwertyuiop'.split(''),
      'asdfghjkl'.split(''),
      ['BACK', 'z','x','c','v','b','n','m', 'ENTER']
    ];

    function renderKeyboard() {
      var kb = document.getElementById('keyboard');
      kb.innerHTML = '';

      for (var ri = 0; ri < KEY_ROWS.length; ri++) {
        var rowEl = document.createElement('div');
        rowEl.className = 'krow';

        for (var ki = 0; ki < KEY_ROWS[ri].length; ki++) {
          var k   = KEY_ROWS[ri][ki];
          var btn = document.createElement('button');
          btn.className = 'key';
          btn.type = 'button';

          var isAction = (k === 'ENTER' || k === 'BACK');

          if (isAction) {
            btn.classList.add('wide');
            btn.dataset.key = k;
            /* Action keys have no quadrants: BACK shows ⌫, ENTER shows label */
            btn.textContent = k === 'BACK' ? '⌫' : k;
          } else {
            /* Letter key: render four quadrant layers (one per board) then the
               letter label on top. Each quadrant is tinted by that board's
               best-known status for this letter. */
            var status = keyState[k.toLowerCase()]; /* array[4] or undefined */
            /* hasHint = true only if this letter still gives USEFUL information,
               i.e. it has a green/orange status on a board that's NOT yet solved.
               Colored hints on already-solved boards don't count — that info is
               spent — so a letter whose only colors are on solved boards becomes
               dead. */
            var hasHint = false;
            for (var q = 0; q < 4; q++) {
              var quad = document.createElement('span');
              quad.className = 'quad q' + q;
              var st = status ? status[q] : null;
              /* Once a board is solved, drop its green (correct) hint so the
                 quadrant reads as default/grey — the board's done, so the
                 "correct letter" cue is no longer useful. Orange (present) and
                 dark (absent) hints are kept for the still-active boards. */
              if (st && !(solved[q] && st === 'correct')) {
                quad.classList.add(st);
              }
              /* Only an unsolved board's colored status keeps the letter alive. */
              if (!solved[q] && (st === 'correct' || st === 'present')) {
                hasHint = true;
              }
              btn.appendChild(quad);
            }

            /* "Dead" letter: used in a guess but no longer useful — it has no
               green/orange status on ANY unsolved board (either it's in none of
               the words, or its only colored boards are already solved). Give
               the whole key a grey background so eliminated letters are obvious
               at a glance — a double cue alongside the grey label. */
            if (status && !hasHint) btn.classList.add('dead');

            var label = document.createElement('span');
            label.className = 'klabel';
            /* Dim letters that have already been used in a guess (white -> grey)
               so players can see at a glance which letters they've tried. */
            if (status) label.classList.add('used');
            label.textContent = k;
            btn.appendChild(label);
          }

          /* Accessible label for screen readers */
          btn.setAttribute('aria-label',
            k === 'BACK'  ? 'Backspace' :
            k === 'ENTER' ? 'Enter guess' :
            'Letter ' + k.toUpperCase()
          );

          /* Closure trick: capture k in its own scope */
          (function (key) {
            btn.addEventListener('click', function () { handleKey(key); });
          }(k));

          rowEl.appendChild(btn);
        }
        kb.appendChild(rowEl);
      }
    }

    /* ============================================
       UPDATE STATUS BAR
       While playing: "X / 4 solved · Guess N / 9"
       When all solved: "4 / 4 solved · N Guesses"
       ============================================ */
    function updateStatus() {
      var solvedCount = solved.filter(Boolean).length;
      var statusEl    = document.getElementById('status');
      if (solvedCount === 4) {
        var used = guesses.length;
        statusEl.textContent =
          '4 / 4 solved · ' + used + (used === 1 ? ' Guess' : ' Guesses');
      } else {
        var guessNum = Math.min(guesses.length + 1, MAX_GUESSES);
        statusEl.textContent =
          solvedCount + ' / 4 solved · Guess ' + guessNum + ' / ' + MAX_GUESSES;
      }
    }

    /* ============================================
       FLASH MESSAGE
       Shows temporary feedback (auto-clears after
       1.8 seconds). Uses aria-live so screen readers
       announce it without user action.
       ============================================ */
    var flashTimer = null;
    function flashMessage(msg) {
      var el = document.getElementById('message');
      el.textContent = msg;
      clearTimeout(flashTimer);
      flashTimer = setTimeout(function () { el.textContent = ''; }, 1800);
    }

    /* ============================================
       INPUT HANDLING
       Single entry point for all input — keyboard
       events and on-screen key clicks both call here.
       ============================================ */
    function handleKey(k) {
      if (gameOver || !VALID_GUESSES) return;

      if (k === 'ENTER') {
        submitGuess();
        return;
      }

      if (k === 'BACK') {
        currentGuess = currentGuess.slice(0, -1); /* Remove last character */
        renderBoards();
        return;
      }

      /* Only accept single alphabet characters, and only if under word length */
      if (/^[a-zA-Z]$/.test(k) && currentGuess.length < WORD_LEN) {
        currentGuess += k.toLowerCase();
        renderBoards();
      }
    }

    /* ============================================
       SUBMIT GUESS
       Validates the guess, scores it against all
       boards, checks win/lose conditions, and
       updates all UI.
       ============================================ */
    function submitGuess() {
      /* Must have a full 5-letter word */
      if (currentGuess.length !== WORD_LEN) {
        flashMessage('Need 5 letters!');
        return;
      }

      /* Must be in the official Wordle dictionary */
      if (!VALID_GUESSES.has(currentGuess)) {
        flashMessage('Not in word list');
        return;
      }

      /* Record the guess */
      guesses.push(currentGuess);

      /* Score against each unsolved board and update keyboard state */
      for (var b = 0; b < NUM_BOARDS; b++) {
        if (solved[b]) continue; /* Skip already-solved boards */

        var score = scoreGuess(currentGuess, targets[b]);

        /* Update keyboard colour for each letter, per board */
        for (var i = 0; i < WORD_LEN; i++) {
          bumpKeyState(currentGuess[i], b, score[i]);
        }

        /* Check if this guess solves this board */
        if (currentGuess === targets[b]) {
          solved[b] = true;
        }
      }

      currentGuess = ''; /* Clear the active guess */

      /* --- Check end conditions --- */
      var allSolved = solved.every(Boolean);

      if (allSolved) {
        gameOver = true;
        setTimeout(function () {
          flashMessage('🎉 All 4 solved in ' + guesses.length + ' guesses!');
        }, 120);

      } else if (guesses.length >= MAX_GUESSES) {
        gameOver = true;
        /* Show which words the player missed */
        var missedWords = targets
          .filter(function (_, i) { return !solved[i]; })
          .join(', ')
          .toUpperCase();
        setTimeout(function () {
          flashMessage('Out of guesses! Missed: ' + missedWords);
        }, 120);
      }

      renderBoards();
      renderKeyboard();
      updateStatus();
    }

    /* ============================================
       KEYBOARD INPUT (Physical keyboard)
       Maps keyboard events to our handleKey function.
       e.preventDefault() stops arrow keys / space
       from scrolling the page while playing.
       ============================================ */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleKey('ENTER');
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        handleKey('BACK');
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        handleKey(e.key);
      }
    });

    /* ============================================
       BOOT SEQUENCE
       1. Load the dictionary (async — may take a moment)
       2. Enable the New Game button
       3. Start the first game
       ============================================ */
    (async function init() {
      await loadDictionary();
      var newBtn = document.getElementById('newBtn');
      newBtn.disabled = false;
      /* Attach the click handler here (inside the IIFE) so it can reach the
         private newGame() function. The old inline onclick="newGame()" failed
         because newGame is not on the global scope. */
      newBtn.addEventListener('click', newGame);
      newGame();
    }());

  }()); /* End IIFE — no globals polluted */
  </script>

  <!-- Site nav and footer injected by these scripts (one level up) -->
  <script src="../nav.js"></script>
  <script src="../footer.js"></script>

</body>
</html>
