<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake — GRaiT GAMES</title>
  <meta name="description" content="Neon Snake — the classic arcade snake with a synthwave glow. Eat, grow, and beat your high score. A GRaiT GAMES original." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles.css" />

  <style>
    .game-stage { max-width: 560px; margin: 0 auto; }

    .game-stats {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .stat-box {
      flex: 1 1 0;
      min-width: 120px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-accessible);
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
      text-align: center;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: var(--space-xs);
    }
    .stat-value {
      font-family: var(--font-headline);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-green);
    }
    #high .stat-value { color: var(--color-orange); }

    /* Canvas board with neon frame */
    .canvas-wrap {
      position: relative;
      border: 2px solid var(--color-green);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--glow-green);
      overflow: hidden;
      background-color: var(--bg-primary);
    }
    #snake-canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* Start / game-over overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-lg);
      background-color: rgba(7, 7, 15, 0.88);
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { color: var(--color-orange); margin-bottom: var(--space-sm); }
    .overlay p  { color: var(--text-description); margin-bottom: var(--space-lg); }

    /* Initials entry panel (inside overlay) */
    #ov-initials { display: none; }
    #ov-initials h2 { color: var(--color-green); }
    #ov-initials p  { margin-bottom: var(--space-md); }

    .initials-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: var(--space-sm) 0 var(--space-lg);
    }
    .initial-box {
      width: 52px;
      height: 60px;
      background: var(--bg-secondary);
      border: 2px solid var(--color-green);
      border-radius: var(--border-radius);
      color: var(--color-green);
      font-family: var(--font-logo);
      font-size: 1.3rem;
      text-align: center;
      text-transform: uppercase;
      caret-color: transparent;
      outline: none;
      box-shadow: var(--glow-green);
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .initial-box:focus {
      border-color: var(--color-cyan);
      color: var(--color-cyan);
      box-shadow: var(--glow-cyan);
    }

    .initials-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .game-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      justify-content: center;
      margin-top: var(--space-lg);
    }

    /* On-screen D-pad for touch devices */
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 64px);
      gap: var(--space-sm);
      justify-content: center;
      margin: var(--space-lg) auto 0;
    }
    .dpad button {
      font-size: 1.4rem;
      border: 2px solid var(--border-accessible);
      background-color: var(--bg-secondary);
      color: var(--color-cyan-2);
      border-radius: var(--border-radius-lg);
      cursor: pointer;
    }
    .dpad button:active { border-color: var(--color-green); color: var(--color-green); }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    /* Show the D-pad on touch / small screens */
    @media (hover: none), (max-width: 600px) {
      .dpad { display: grid; }
    }

    .hint {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: var(--space-md);
    }

    /* ── Leaderboard (right-aligned panel below canvas) ─────────── */
    .leaderboard {
      width: 250px;
      margin-left: auto;
      margin-top: var(--space-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border-accessible);
      border-radius: var(--border-radius-lg);
      padding: var(--space-md);
    }
    .lb-heading {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-green);
      text-align: center;
      margin-bottom: var(--space-md);
    }
    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .lb-table th {
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-accessible);
      text-align: left;
    }
    .lb-table th:last-child,
    .lb-table td:last-child { text-align: right; }
    .lb-table td {
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }
    .lb-rank  { color: var(--text-muted); width: 2.2rem; }
    .lb-name  { color: var(--color-cyan); font-weight: 600; letter-spacing: 0.18em; }
    .lb-score { color: var(--color-green); }
    .lb-empty { text-align: center; color: var(--text-muted); padding: 20px 8px; }
    tr.lb-new .lb-name,
    tr.lb-new .lb-score { color: var(--color-orange); }
  </style>
</head>
<body>

  <a href="#game" class="skip-link">Skip to game</a>

  <nav id="main-nav"></nav>

  <main class="container-narrow section" id="game">

    <!-- Header bar: back | title | restart -->
    <div class="game-header">
      <a href="/games.html" class="btn btn-outline-cyan btn-icon" aria-label="Back to Catalog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></a>
      <p class="game-title-bar" role="heading" aria-level="1">NEON SNAKE</p>
      <button type="button" class="btn-restart" id="restart" aria-label="Restart game"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>

    <header class="text-center mb-xl">
      <p class="text-description">
        Eat the <span class="text-orange">orange pellets</span>, grow longer, and
        speed up. Don't hit the walls or yourself!
      </p>
    </header>

    <div class="game-stage">

      <div class="game-stats" role="status" aria-live="polite">
        <div class="stat-box" id="score-box">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box" id="high">
          <div class="stat-label">Best</div>
          <div class="stat-value" id="highscore">0</div>
        </div>
      </div>

      <div class="canvas-wrap">
        <!-- Internal resolution 400×400 (20px × 20 cells). CSS scales it. -->
        <canvas id="snake-canvas" width="400" height="400"
                aria-label="Snake game board"></canvas>

        <!-- Overlay — shared by: ready, paused, game-over, initials-entry -->
        <div class="overlay" id="overlay">

          <!-- Standard state: ready / paused / game-over -->
          <div id="ov-standard">
            <h2 id="overlay-title">Ready?</h2>
            <p id="overlay-text">Use the arrow keys (or the buttons below) to steer.</p>
            <button type="button" class="btn btn-secondary" id="start-btn">▶ Start Game</button>
          </div>

          <!-- Initials entry: shown when score qualifies for top 10 -->
          <div id="ov-initials">
            <h2>🏆 Top Score!</h2>
            <p id="ov-score-label"></p>
            <p style="margin-bottom:0;">Enter your initials:</p>
            <div class="initials-row">
              <input class="initial-box" id="i0" type="text" maxlength="1"
                     inputmode="text" autocomplete="off" spellcheck="false"
                     aria-label="First initial" />
              <input class="initial-box" id="i1" type="text" maxlength="1"
                     inputmode="text" autocomplete="off" spellcheck="false"
                     aria-label="Second initial" />
              <input class="initial-box" id="i2" type="text" maxlength="1"
                     inputmode="text" autocomplete="off" spellcheck="false"
                     aria-label="Third initial" />
            </div>
            <div class="initials-actions">
              <button type="button" class="btn btn-primary" id="submit-initials">Submit</button>
              <button type="button" class="btn btn-outline-cyan" id="skip-initials">Skip</button>
            </div>
          </div>

        </div>
      </div>

      <!-- Touch controls -->
      <div class="dpad" aria-label="Direction controls">
        <button type="button" class="up"    data-dir="up"    aria-label="Up">▲</button>
        <button type="button" class="left"  data-dir="left"  aria-label="Left">◀</button>
        <button type="button" class="down"  data-dir="down"  aria-label="Down">▼</button>
        <button type="button" class="right" data-dir="right" aria-label="Right">▶</button>
      </div>

      <p class="hint">Tip: press <span class="text-green">Space</span> to pause.</p>

      <!-- Leaderboard -->
      <section class="leaderboard" aria-labelledby="lb-heading">
        <p class="lb-heading" id="lb-heading">// Top 10 This Month //</p>
        <table class="lb-table" aria-label="Monthly leaderboard">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Score</th>
            </tr>
          </thead>
          <tbody id="lb-body">
            <tr><td colspan="3" class="lb-empty">Loading…</td></tr>
          </tbody>
        </table>
      </section>

    </div><!-- /.game-stage -->
  </main>

  <script>
  (function () {
    'use strict';

    var GAME_KEY = 'snake';

    var canvas = document.getElementById('snake-canvas');
    var ctx = canvas.getContext('2d');

    var GRID = 20;                 // cells per row/column
    var CELL = canvas.width / GRID; // pixel size of each cell (20px)

    /* Brand colors (read once so the canvas matches the stylesheet) */
    var COLORS = {
      bg: '#07070F',
      grid: 'rgba(57,255,20,0.06)',
      snakeHead: '#39FF14',
      snakeBody: '#00FF88',
      food: '#FF6B2B'
    };

    /* DOM refs — game */
    var scoreEl    = document.getElementById('score');
    var highEl     = document.getElementById('highscore');
    var overlay    = document.getElementById('overlay');
    var ovStandard = document.getElementById('ov-standard');
    var ovInitials = document.getElementById('ov-initials');
    var ovTitle    = document.getElementById('overlay-title');
    var ovText     = document.getElementById('overlay-text');
    var ovScoreLbl = document.getElementById('ov-score-label');
    var startBtn   = document.getElementById('start-btn');
    var restartBtn = document.getElementById('restart');

    /* DOM refs — initials */
    var initBoxes      = [
      document.getElementById('i0'),
      document.getElementById('i1'),
      document.getElementById('i2')
    ];
    var submitInitials = document.getElementById('submit-initials');
    var skipInitials   = document.getElementById('skip-initials');

    /* DOM refs — leaderboard */
    var lbBody = document.getElementById('lb-body');

    /* Game state */
    var snake, dir, nextDir, food, score, speed, loopId, running, paused;

    /* Persisted high score */
    var HS_KEY = 'graitSnakeHighScore';
    var highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
    highEl.textContent = highScore;

    /* Cached leaderboard for qualifying check */
    var cachedScores = [];

    /* ── Leaderboard helpers ────────────────────────────────────────── */

    function fetchLeaderboard() {
      fetch('/api/scores?game=' + GAME_KEY)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && data.scores) {
            cachedScores = data.scores;
            renderLeaderboard(cachedScores, null);
          } else {
            renderLeaderboard([], null);
          }
        })
        .catch(function () { renderLeaderboard([], null); });
    }

    function renderLeaderboard(scores, newInitials) {
      if (!scores || scores.length === 0) {
        lbBody.innerHTML = '<tr><td colspan="3" class="lb-empty">No scores yet this month. Be first!</td></tr>';
        return;
      }
      lbBody.innerHTML = scores.map(function (row, i) {
        var rank = i + 1;
        var medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank + '.';
        var isNew = newInitials && row.initials === newInitials && i === scores.findIndex(function (s) { return s.initials === newInitials; });
        return '<tr' + (isNew ? ' class="lb-new"' : '') + '>' +
          '<td class="lb-rank">' + medal + '</td>' +
          '<td class="lb-name">'  + escHtml(row.initials) + '</td>' +
          '<td class="lb-score">' + row.score + '</td>' +
          '</tr>';
      }).join('');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function qualifiesForLeaderboard(s) {
      if (s <= 0) return false;
      if (cachedScores.length < 10) return true;
      return s > cachedScores[cachedScores.length - 1].score;
    }

    /* ── Initials entry ─────────────────────────────────────────────── */

    function showInitialsEntry() {
      ovScoreLbl.textContent = 'You scored ' + score + '!';
      ovStandard.style.display = 'none';
      ovInitials.style.display = 'block';
      resetInitialBoxes();
      initBoxes[0].focus();
    }

    function resetInitialBoxes() {
      initBoxes.forEach(function (b) { b.value = ''; });
    }

    function showStandardOverlay(title, text, btnText) {
      ovInitials.style.display = 'none';
      ovStandard.style.display = '';
      ovTitle.textContent = title;
      if (text !== null) ovText.innerHTML = text;
      startBtn.textContent = btnText;
      overlay.classList.remove('hidden');
    }

    /* Wire up each initial box: only A-Z, auto-advance, backspace goes back */
    initBoxes.forEach(function (box, idx) {
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace') {
          e.preventDefault();
          box.value = '';
          if (idx > 0) initBoxes[idx - 1].focus();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          submitInitials.click();
          return;
        }
        if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); initBoxes[idx - 1].focus(); return; }
        if (e.key === 'ArrowRight' && idx < 2) { e.preventDefault(); initBoxes[idx + 1].focus(); return; }
      });

      box.addEventListener('input', function () {
        // Keep only the last typed character, uppercase, A-Z
        var val = box.value.replace(/[^A-Za-z]/g, '').slice(-1).toUpperCase();
        box.value = val;
        if (val && idx < 2) {
          initBoxes[idx + 1].focus();
        }
      });
    });

    submitInitials.addEventListener('click', function () {
      var initials = initBoxes.map(function (b) { return b.value.toUpperCase(); }).join('');
      if (!/^[A-Z]{3}$/.test(initials)) {
        initBoxes[initials.replace(/[^A-Z]/g, '').length] && initBoxes[initials.replace(/[^A-Z]/g, '').length].focus();
        return;
      }

      submitInitials.disabled = true;
      skipInitials.disabled = true;
      submitInitials.textContent = 'Saving…';

      fetch('/api/submit-score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: GAME_KEY, initials: initials, score: score })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.accepted && data.scores) {
            cachedScores = data.scores;
            renderLeaderboard(cachedScores, initials);
          }
          showStandardOverlay(
            data.accepted ? '✓ Score Saved!' : '💀 Game Over',
            data.accepted
              ? 'You scored <strong class="text-green">' + score + '</strong>. Check the leaderboard!'
              : 'You scored <strong class="text-green">' + score + '</strong>. ' + (score >= highScore ? 'New best!' : 'Best: ' + highScore),
            '▶ Play Again'
          );
        })
        .catch(function () {
          showStandardOverlay('💀 Game Over',
            'You scored <strong class="text-green">' + score + '</strong>. ' + (score >= highScore ? 'New best!' : 'Best: ' + highScore),
            '▶ Play Again');
        })
        .finally(function () {
          submitInitials.disabled = false;
          skipInitials.disabled = false;
          submitInitials.textContent = 'Submit';
        });
    });

    skipInitials.addEventListener('click', function () {
      showStandardOverlay('💀 Game Over',
        'You scored <strong class="text-green">' + score + '</strong>. ' + (score >= highScore ? 'New best!' : 'Best: ' + highScore),
        '▶ Play Again');
    });

    /* ── Game logic ─────────────────────────────────────────────────── */

    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };       // moving right
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 140;                // ms per step (lower = faster)
      paused = false;
      scoreEl.textContent = '0';
      placeFood();
      draw();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
    }

    function startLoop() {
      clearInterval(loopId);
      loopId = setInterval(tick, speed);
    }

    function tick() {
      if (paused) return;

      dir = nextDir;
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      /* Wall collision */
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }
      /* Self collision */
      if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
        return gameOver();
      }

      snake.unshift(head);

      /* Eat food? */
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        /* Speed up every 30 points, down to a 70ms floor */
        if (score % 30 === 0 && speed > 70) {
          speed -= 10;
          startLoop();
        }
        placeFood();
      } else {
        snake.pop();             // move forward (no growth)
      }

      draw();
    }

    function draw() {
      /* Background */
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      /* Grid lines */
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      for (var i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
      }

      /* Food (glowing pellet) */
      ctx.fillStyle = COLORS.food;
      ctx.shadowColor = COLORS.food;
      ctx.shadowBlur = 12;
      roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 4);
      ctx.shadowBlur = 0;

      /* Snake */
      snake.forEach(function (seg, idx) {
        ctx.fillStyle = idx === 0 ? COLORS.snakeHead : COLORS.snakeBody;
        if (idx === 0) { ctx.shadowColor = COLORS.snakeHead; ctx.shadowBlur = 10; }
        roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.shadowBlur = 0;
      });
    }

    /* Helper: filled rounded rectangle */
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function startGame() {
      reset();
      running = true;
      ovInitials.style.display = 'none';
      ovStandard.style.display = '';
      overlay.classList.add('hidden');
      startLoop();
    }

    function gameOver() {
      clearInterval(loopId);
      running = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(HS_KEY, String(highScore));
        highEl.textContent = highScore;
      }

      overlay.classList.remove('hidden');

      if (qualifiesForLeaderboard(score)) {
        showInitialsEntry();
      } else {
        showStandardOverlay(
          '💀 Game Over',
          'You scored <strong class="text-green">' + score + '</strong>. ' +
            (score >= highScore ? 'New best!' : 'Best: ' + highScore),
          '▶ Play Again'
        );
      }
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        showStandardOverlay('⏸ Paused', 'Press Space or Start to resume.', '▶ Resume');
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
      }
    }

    /* --- INPUT: change direction (block 180° reversals) --- */
    function setDir(d) {
      if (!running) return;
      var map = {
        up:    { x: 0,  y: -1 },
        down:  { x: 0,  y: 1 },
        left:  { x: -1, y: 0 },
        right: { x: 1,  y: 0 }
      };
      var nd = map[d];
      if (!nd) return;
      /* Can't reverse straight back onto yourself */
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    }

    document.addEventListener('keydown', function (e) {
      /* Don't hijack arrow keys when the user is typing initials */
      if (document.activeElement && document.activeElement.classList.contains('initial-box')) return;

      var keys = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right'
      };
      if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePause(); return; }
      if (keys[e.key]) { e.preventDefault(); setDir(keys[e.key]); }
    });

    /* Touch D-pad */
    Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (btn) {
      btn.addEventListener('click', function () { setDir(btn.dataset.dir); });
    });

    startBtn.addEventListener('click', function () {
      if (paused) { togglePause(); } else { startGame(); }
    });
    restartBtn.addEventListener('click', startGame);

    /* Initial render (board visible behind the overlay) + load leaderboard */
    reset();
    fetchLeaderboard();
  })();
  </script>

  <script src="../nav.js"></script>
  <script src="../footer.js"></script>
</body>
</html>
